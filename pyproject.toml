[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apicheck"
version = "0.1.0"
description = "Catch hallucinated and deprecated API calls against the exact package versions you have installed."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apicheck = "apicheck.cli:main"

[tool.setuptools]
packages = ["apicheck"]
